<!doctype html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>best</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/tv.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
</head>
<body>
<!--导航-->
<nav class="navbar bg-dark navbar-dark " >
    <a class="navbar-brand" href="#">
        <img th:src="@{/img/logo.png}" height="50">
    </a>
    <div class="d-flex me-auto">
        <ul class="navbar-nav flex-row gap-2 ">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">首页</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/tv}">电视剧</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/anime}">动漫</a></li>
            <li class="nav-item"><a class="nav-link active" href="#">电影</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">影视管理</a></li>
        </ul>
    </div>
    <form class="d-inline-flex ms-auto" th:action="@{/search}" method="get">
        <input type="hidden" name="cid" value="15">
        <input class="form-control me-3" type="text" name="keyword" style="height: 35px;width: 200px" placeholder="Search..."/>
        <button class="btn btn-outline-secondary me-2" style="height: 35px;width: 60px">搜索</button>
    </form>
    <!-- 已登录：昵称+下拉退出菜单 -->
    <div class="dropdown me-1" sec:authorize="isAuthenticated()">
        <button class="btn dropdown-toggle d-flex align-items-center gap-1 w-auto"
                style="justify-content:flex-start;"
                type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span style="width:40px;height:40px;border-radius:50%;background:#448aff;color:white;display:flex;align-items:center;justify-content:center;"></span>
            <span style="color: white" th:text="${session.loginUser?.nickname}"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" style="width:90px;">
            <li>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="dropdown-item text-danger text-center" type="submit">退出登录</button>
                </form>
            </li>
        </ul>
    </div>

</nav>
<div class="container">
    <div id="fenlei1" class="row g-2 mt-3">
        <div class="col-auto">
            <button class="btn btn-outline-secondary" id="buttonA"
                    th:classappend="${!hasThemeSelect} ? 'active' : ''"
                    onclick="location.href='/film'">
                全部
            </button>
        </div>
        <div class="col-auto" th:each="item : ${category}" th:if="${item.id >= 1 && item.id <= 13}">
            <button class="btn btn-outline-secondary" id="buttonB"
                    th:classappend="${selectedCids != null && #lists.contains(selectedCids, item.id)} ? 'active' : ''"
                    th:onclick="|toggleCid(${item.id})|"
                    th:text="${item.name}">
            </button>
        </div>
    </div>
    <div id="fenlei2" class="row g-2 mt-3">
        <div class="col-auto">
            <button class="btn btn-outline-secondary" id="buttonC"
                    th:classappend="${!hasAreaSelect} ? 'active' : ''"
                    onclick="location.href='/film'">
                全部
            </button>
        </div>
        <div class="col-auto" th:each="item : ${category}" th:if="${item.id >= 17 && item.id <= 26}">
            <button class="btn btn-outline-secondary" id="buttonD"
                    th:classappend="${selectedCids != null && #lists.contains(selectedCids, item.id)} ? 'active' : ''"
                    th:onclick="|toggleCid(${item.id})|"
                    th:text="${item.name}">
            </button>
        </div>
    </div>
</div>
<div class="container">
    <div id="显示" class="mt-2">
        <div class="row g-4">
            <div class="col-2" th:each="film:${film}">
                <div class="card mt-3 mb-3 d-flex flex-column">
                    <img th:src="${film.cover_img}" style="height: 220px; object-fit: cover;"/>
                    <div class="card-body">
                        <h6 th:text="${film.title}"></h6>
                        <p th:text="'共'+ ${film.episodes} + '集'"></p>
                    </div>
                    <div class="p-2 d-flex justify-content-end">
                        <button class="btn btn-sm btn-dark ml-auto d-block" th:onclick="|location.href='@{/bofang(id=${film.id})}'|">开始播放</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    function toggleCid(cid) {
        const urlParams = new URLSearchParams(window.location.search);
        let arr = urlParams.getAll('cids').map(Number);

        if(cid >=1 && cid <=13){
            arr = arr.filter(x=> !(x>=1 && x<=13));
        }

        else if(cid >=17 && cid <=26){
            arr = arr.filter(x=> !(x>=17 && x<=26));
        }

        arr.push(cid);

        let params = new URLSearchParams();
        arr.forEach(p => params.append('cids', p));
        window.location.href = '/film?' + params.toString();
    }

</script>
</html>
