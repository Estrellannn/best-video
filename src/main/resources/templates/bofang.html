<!doctype html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>best</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bofang.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
</head>
<body>
<!--导航-->
<nav class="navbar bg-dark navbar-dark " >
    <a class="navbar-brand" href="#">
        <img th:src="@{/img/logo.png}" height="50">
    </a>
    <div class="d-flex me-auto">
        <ul class="navbar-nav flex-row gap-2 ">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">首页</a></li>
            <li class="nav-item"><a class="nav-link " th:href="@{/tv}">电视剧</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/anime}">动漫</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/film}">电影</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">影视管理</a></li>
        </ul>
    </div>
    <form class="d-inline-flex ms-auto" th:action="@{/search}" method="get">
        <input class="form-control me-3" type="text" name="keyword" style="height: 35px;width: 200px" placeholder="Search..."/>
        <button class="btn btn-outline-secondary me-2" style="height: 35px;width: 60px">搜索</button>
    </form>
    <!-- 已登录：昵称+下拉退出菜单 -->
    <div class="dropdown me-1" sec:authorize="isAuthenticated()">
        <button class="btn dropdown-toggle d-flex align-items-center gap-1 w-auto"
                style="justify-content:flex-start;"
                type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span style="width:40px;height:40px;border-radius:50%;background:#448aff;color:white;display:flex;align-items:center;justify-content:center;"></span>
            <span style="color: white" th:text="${session.loginUser?.nickname}"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" style="width:90px;">
            <li>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="dropdown-item text-danger text-center" type="submit">退出登录</button>
                </form>
            </li>
        </ul>
    </div>

</nav>
<div class="container mt-4">
    <!-- 如果video为空 -->
    <div th:if="${video == null}" class="alert alert-warning">
        视频不存在
    </div>

    <div th:if="${video != null}">
        <h2 th:text="${video.title}"></h2>
        <hr>
        <!-- 视频容器区域 -->
        <div style="position:relative;width:100%;max-width:1200px;margin:0 auto;">
            <!-- 封面图 -->
            <img th:src="${video.cover_img}"
                 th:style="${(num != null and currentEp != null)} ? 'display:none;width:100%;height:460px;object-fit:contain;background:#fff;' : 'width:100%;height:460px;object-fit:contain;background:#fff;'"
                 alt="封面">

            <video controls
                   th:style="${(num == null or currentEp == null)} ? 'display:none;width:100%;height:520px;object-fit:contain;' : 'width:100%;height:520px;object-fit:contain;'">
                <source th:src="${currentEp?.videopath}" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
        </div>

        <div class="mt-3">
            <h4>简介</h4>
            <p th:text="${video.info}"></p>
        </div>
    </div>

    <div class="mb-4">
        <h4>选集</h4>
        <div th:each="ep:${epList}" style="display:inline-block;margin:6px;">
            <a th:href="@{/bofang(id=${ep.v_id},num=${ep.num})}"
               style="display:inline-block;padding:8px 18px;background:transparent;color:#6c757d;border:1px solid #6c757d;border-radius:4px;text-decoration:none;cursor:pointer;font-size:14px;"
               th:style="${num == ep.num}
               ? 'display:inline-block;padding:8px 18px;background:#6c757d;color:#fff;border:1px solid #6c757d;border-radius:4px;text-decoration:none;cursor:pointer;font-size:14px;'
               : 'display:inline-block;padding:8px 18px;background:transparent;color:#6c757d;border:1px solid #6c757d;border-radius:4px;text-decoration:none;cursor:pointer;font-size:14px;'">
                [[${ep.name}]]
            </a>
        </div>
    </div>

</div>

</body>
</html>
