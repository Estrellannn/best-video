<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>best</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/manage.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <th:block th:if="${_csrf != null}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </th:block>
</head>
<body>
<!--导航-->
<nav class="navbar bg-dark navbar-dark " >
    <a class="navbar-brand" href="#">
        <img th:src="@{/img/logo.png}" height="50">
    </a>
    <div class="d-flex me-auto">
        <ul class="navbar-nav flex-row gap-2 ">
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">影视管理</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/tv}">电视剧</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/anime}">动漫</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/film}">电影</a></li>
        </ul>
    </div>
    <form class="d-inline-flex ms-auto" th:action="@{/admin/searchf}" method="get">
        <input type="hidden" name="cid" value="15">
        <input name="keyword" class="form-control me-3" type="text" style="height: 35px;width: 200px" placeholder="Search..."/>
        <button class="btn btn-outline-secondary me-4" style="height: 35px;width: 60px">搜索</button>
    </form>
</nav>
<div class="container">
    <div id="leibie" class="mt-4 mb-2" >
        <p class="h3">电影</p>
        <button id="new" class="btn-sm btn btn-success" onclick="addfilm()">新增电影</button>
    </div>

    <!-- 数据表格 -->
    <table class="table table-bordered table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>封面图片</th>
            <th>剧名</th>
            <th>类型</th>
            <th>简介</th>
            <th>集数</th>
            <th>资源操作</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="video : ${showFilm}">
            <td th:text="${video.id}"></td>
            <td>
                <img th:src="${video.cover_img}" style="width:80px;height:100px;object-fit:cover;">
            </td>
            <td th:text="${video.title}"></td>
            <td>
                <button class="btn btn-sm btn-outline-secondary" th:data-vid="${video.id}" onclick="openCatModal(this)">点击查看</button>
            </td>
            <td th:text="${video.info}"></td>
            <td th:text="${video.episodes}+' 集'"></td>
            <td>
                <div class="d-grid gap-1">
                    <button class="btn btn-sm btn-outline-secondary openEpModal" th:data-vid="${video.id}" th:data-title="${video.title}">更新剧集资源</button>
                </div>
            </td>
            <td>
                <div class="d-flex gap-1">
                    <button class="btn-sm btn btn-light" th:data-id="${video.id}" th:data-title="${video.title}" th:data-info="${video.info}" th:data-episodes="${video.episodes}" th:data-cover_img="${video.cover_img ?: ''}" onclick="editfilm(this)">编辑</button>
                    <button class="btn-sm btn btn-dark" th:data-id="${video.id}" onclick="deletefilm(this)">删除</button>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 分页 -->
    <div class="d-flex justify-content-center mt-3 mb-4">
        <nav>
            <ul class="pagination mb-0">

                <li class="page-item" th:class="${pageInfo.pageNum == 1} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link text-dark border-dark" th:href="@{/admin/film(pageNum=${pageInfo.pageNum - 1})}">上一页</a>
                </li>

                <li class="page-item active">
                    <a class="page-link bg-dark border-dark text-white" th:text="'第 ' + ${pageInfo.pageNum} + ' 页'"></a>
                </li>

                <li class="page-item" th:class="${pageInfo.pageNum >= pageInfo.pages} ? 'page-item disabled' : 'page-item'">
                    <a class="page-link text-dark border-dark" th:href="@{/admin/film(pageNum=${pageInfo.pageNum + 1})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>


</div>


<!-- 新增类别弹窗 -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增电影</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <form th:action="@{/admin/film/add}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label>id</label>
                        <input type="text" class="form-control mb-2" name="id" required th:value="${maxId != null ? maxId + 1 : 1}">
                        <label>电影名称</label>
                        <input type="text" class="form-control mb-2" name="title" required>
                        <label>简介</label>
                        <textarea class="form-control mb-2" name="info"  rows="4" required></textarea>
                        <label>集数</label>
                        <input type="text" class="form-control mb-2" name="episodes" required>
                        <label>当前封面</label>
                        <img id="previewCover" style="width: 100%; max-height:240px; object-fit:cover; margin-bottom:10px; display:none;">
                        <label>更换封面（不选则保留原图）</label>
                        <input type="file" class="form-control mb-2" name="coverImg" accept="image/*" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 编辑类别弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑电影</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <form th:action="@{/admin/film/edit}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label>id</label>
                        <input type="text" class="form-control mb-2" name="id" id="id" required>
                        <label>电影名称</label>
                        <input type="text" class="form-control mb-2" name="title" id="title" required>
                        <label>简介</label>
                        <textarea class="form-control mb-2" name="info" id="info" rows="4" required></textarea>
                        <label>集数</label>
                        <input type="text" class="form-control mb-2" name="episodes" id="episodes" required>
                        <label>当前封面</label>
                        <img id="previewCovera" style="width: 100%; max-height:240px; object-fit:cover; margin-bottom:10px; display:none;">
                        <label>更换封面（不选则保留原图）</label>
                        <input type="file" class="form-control mb-2" name="coverImg" accept="image/*" >
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 分类弹窗 -->
<div class="modal fade" id="catModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>影视分类管理</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>类型：</strong><span id="modalType"></span></p>
                <p><strong>地区：</strong><span id="modalArea"></span></p>
                <hr>
                <p>编辑绑定分类：</p>

                <div class="row">
                    <div class="col-6">
                        <h6>类型</h6>
                        <div th:each="c : ${allCategory}" th:if="${c.id >=1 && c.id <=13}">
                            <label>
                                <input type="checkbox" th:value="${c.id}" name="catCheck">
                                <span th:text="${c.name}"></span>
                            </label>
                            <br/>
                        </div>
                    </div>

                    <div class="col-6">
                        <h6>地区</h6>
                        <div th:each="c : ${allCategory}" th:if="${c.id >=17 && c.id <=26}">
                            <label>
                                <input type="checkbox" th:value="${c.id}" name="catCheck">
                                <span th:text="${c.name}"></span>
                            </label>
                            <br/>
                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button class="btn btn-primary" onclick="saveCat()">保存修改</button>
            </div>
        </div>
    </div>
</div>

<!-- 剧集弹窗 -->
<div class="modal fade" id="epModal" tabindex="-1" aria-labelledby="epModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="epModalLabel">剧集资源  - <span id="epVideoTitle"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="vid">
                <div class="row">
                    <div class="col-6">
                        <label>集数</label>
                        <input type="number" id="episode" class="form-control" placeholder="输入集号，如1">
                    </div>

                    <div class="col-6">
                        <label>视频文件名（D:/video_upload里的文件名）</label>
                        <input type="text" id="videoPath" class="form-control" placeholder="第x集">
                    </div>

                    <div class="mt-2">
                        <label>选择视频文件：</label>
                        <input type="file" id="videoFile" accept=".mp4" class="form-control">
                    </div>
                </div>
                <hr>
                <div>
                    <h6>已有剧集列表</h6>
                    <div id="epList">

                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-success" onclick="saveEpisode()">保存剧集</button>
            </div>
        </div>
    </div>
</div>

</body>
<script>

    let token = $("meta[name='_csrf']").attr("content");
    let header = $("meta[name='_csrf_header']").attr("content");
    $(document).ajaxSend(function(e, xhr, options) {
        xhr.setRequestHeader(header, token);
    });

    function addfilm() {
        let show=new bootstrap.Modal(document.getElementById("addModal"));
        show.show();
    }

    function editfilm(btn) {
        let id=btn.dataset.id;
        let title=btn.dataset.title;
        let info=btn.dataset.info;
        let episodes=btn.dataset.episodes;
        let coverImgUrl = btn.dataset.cover_img;

        document.getElementById("id").value=id;
        document.getElementById("title").value=title;
        document.getElementById("info").value=info;
        document.getElementById("episodes").value=episodes;

        let previewImg = document.getElementById("previewCovera");
        if(coverImgUrl && coverImgUrl !== ''){
            previewImg.src = coverImgUrl;
            previewImg.style.display = "block";
        }else{
            previewImg.style.display = "none";
        }

        let show=new bootstrap.Modal(document.getElementById("editModal"))
        show.show();
    }

    function deletefilm(btn) {
        let id=btn.dataset.id;
        if (confirm("确定删除吗？")){
            location.href = "/admin/film/delete?id=" + id;
        }
    }

    let currentVid = 0;

    function openCatModal(btn){
        const vid = btn.dataset.vid;
        currentVid = vid;
        fetch('/admin/getFVideoCat?vid='+vid)
            .then(res=>res.json())
            .then(data=>{
                document.getElementById("modalType").innerText = data.typeStr || "-";
                document.getElementById("modalArea").innerText = data.areaStr || "-";
                const cidArr = data.catIds || [];
                document.querySelectorAll("input[name='catCheck']").forEach(i=>i.checked=false);
                cidArr.forEach(id=>{
                    let input = document.querySelector(`input[value="${id}"]`);
                    if(input) input.checked = true;
                })
                new bootstrap.Modal(document.getElementById("catModal")).show();
            })
    }

    function saveCat(){
        let checkList = [];
        document.querySelectorAll("input[name='catCheck']").forEach(i=>{
            if(i.checked){
                checkList.push(i.value);
            }
        });
        // 拿CSRF令牌
        const csrf = document.querySelector('meta[name="_csrf"]').content;
        fetch("/admin/updateFVideoCat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "X-CSRF-Token": csrf
            },
            body:JSON.stringify({vid:currentVid,cidList:checkList})
        }).then(res=>{
            if(!res.ok) throw new Error("服务异常");
            return res.text();
        }).then(()=>{
            alert("保存成功");
            location.reload();
        }).catch(err=>{
            console.error(err);
            alert("保存分类失败，请重试");
        })
    }



    let epModal = new bootstrap.Modal(document.getElementById('epModal'));

    $('.openEpModal').click(function(){

        currentVid = $(this).data('vid');
        const title = $(this).data('title');

        console.log("拿到的vid：", currentVid);
        console.log("拿到的title：", title);

        $('#epVideoTitle').text(title);
        $('#vid').val(currentVid);

        $('#episode').val('');
        $('#videoPath').val('');

        loadEpList(currentVid);
        epModal.show();
    })

    function loadEpList(vid){
        $.get("/admin/getEpList",{vid:vid},function(res){
            let html = "";
            res.forEach(item=>{
                html += `<div class="d-flex justify-content-between border p-2 my-1">
                <span>第${item.num}集：${item.videopath}</span>
                <button class="btn btn-danger btn-sm" onclick="delEp(${item.id},${vid})">删除</button>
            </div>`
            })
            $('#epList').html(html);
        })
    }

    function saveEpisode(){
        let vid = $('#vid').val();
        let episode = $('#episode').val();
        let videoPath = $('#videoPath').val();
        let file = document.getElementById("videoFile").files[0];

        if(!episode){
            alert("请输入集数！");
            return;
        }
        if(!file){
            alert("请选择视频文件！");
            return;
        }

        let formData = new FormData();
        formData.append("file", file);
        formData.append("vId", vid);
        formData.append("num", episode);
        formData.append("videopath", videoPath);
        formData.append("name", "第"+episode+"集");

        $.ajax({
            url:"/admin/saveEpisode",
            type:"post",
            data:formData,
            contentType:false,
            processData:false,
            success:function(res){
                alert("保存成功");
                loadEpList(vid);
                //清空表单
                $('#episode').val('');
                $('#videoPath').val('');
                $("#videoFile").val('');
            }
        })
    }

    function delEp(epId,vid){
        if(confirm("确定删除这一集？")){
            $.post("/admin/delEpisode",{id:epId},()=>{
                loadEpList(vid);
            })
        }
    }

    $("#videoFile").on("change",function(){
        let file = this.files[0];
        if(file){
            $("#videoPath").val(file.name);
        }
    })

</script>
</html>
