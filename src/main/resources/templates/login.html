<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,body{
            height:100%;
            margin:0;
        }
        .left-box{
            background-color:black;
            height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:white;
        }
        .right-box{
            height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .login-wrap{
            width:400px;
        }
    </style>
</head>
<body>
<div class="row g-0 h-100">
    <!-- 左侧蓝色区域 -->
    <div class="col-4 left-box p-2">
        <div>
            <img th:src="@{/img/rocket.jpg}" alt="rocket" style="width:350px;">
        </div>
        <h2 class="mt-4">best</h2>
    </div>

    <!-- 右侧登录表单区域 -->
    <div class="col-8 right-box">
        <div class="login-wrap">
            <div class="d-flex align-items-center gap-3 mb-2">
                <h2>账号登录</h2>
                <span class="text-secondary">使用用户名和密码登录</span>
            </div>
            <p class="mb-4">还没有账号？<a th:href="@{/register}" class="text-primary text-decoration-none">立即注册</a></p>

            <!-- 错误提示 -->
            <p class="text-danger" th:text="${msg}" th:if="${msg}"></p>

            <form action="/doLogin" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-3">登录</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
