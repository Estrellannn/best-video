<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <style>
        html,body{
            height:100%;
            margin:0;
        }
        .left-box{
            background-color:black;
            height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:white;
        }
        .right-box{
            height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .login-wrap{
            width:400px;
        }
    </style>
</head>
<body>
<div class="row g-0 h-100">

    <div class="col-4 left-box p-2">
        <div>
            <img th:src="@{/img/rocket.jpg}" alt="rocket" style="width:350px;">
        </div>
        <h2 class="mt-4">best</h2>
    </div>

    <div class="col-8 right-box">
        <div class="login-wrap">
            <div class="d-flex align-items-center gap-3 mb-2">
                <h2>账号注册</h2>
                <span class="text-secondary">使用用户名和密码注册</span>
            </div>
            <p class="mb-4">已有账号？<a th:href="@{/login}" class="text-primary text-decoration-none">立即登录</a></p>

            <p class="text-danger" th:text="${msg}" th:if="${msg}"></p>

            <form action="/doRegister" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">昵称</label>
                    <input type="text" name="nickname" class="form-control" placeholder="请输入昵称" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-3">注册</button>
            </form>
        </div>
    </div>
</div>

<span id="msgBox" class="d-none" th:text="${successMsg}"></span>

<!-- 注册成功弹窗 -->
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">提示</h5>
            </div>
            <div class="modal-body">
                <p th:text="${successMsg}"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" onclick="location.href='/login'">确定</button>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    window.onload = function(){
        // 获取隐藏标签里的文字
        let msgText = document.getElementById("msgBox").innerText.trim();
        if(msgText !== ""){

            let myModal = new bootstrap.Modal(document.getElementById('successModal'));
            myModal.show();
        }
    }
</script>

</html>
